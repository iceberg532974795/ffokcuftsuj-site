<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#090513">
  <title>紫域回声 · 写给未来的自己</title>
  <style>
    * { box-sizing: border-box; }
    :root { color-scheme: dark; --violet:#bca4ff; --violet-2:#7651dc; --ink:#090513; --panel:rgba(14,9,28,.76); --line:rgba(209,196,255,.18); --muted:rgba(235,229,255,.58); --ease:cubic-bezier(.22,.75,.18,1); }
    html, body { width:100%; min-height:100%; margin:0; overflow:hidden; background:var(--ink); }
    body { color:#f7f3ff; font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif; }
    button, input, textarea { font:inherit; }
    button, a, label { -webkit-tap-highlight-color:transparent; }

    .app { --progress:0; position:fixed; inset:0; isolation:isolate; overflow:hidden; background:#07040e; }
    .cosmos-bg { position:absolute; z-index:0; inset:-2%; background:url("assets/violet/variants/a-glass-gravity.jpg") 50% 50%/cover no-repeat; opacity:calc(.48 + var(--progress) * .52); filter:brightness(calc(.56 + var(--progress) * .4)) saturate(calc(.72 + var(--progress) * .34)); transform:scale(calc(1.035 - var(--progress) * .02)); transition:opacity 1.2s var(--ease),filter 1.2s var(--ease),transform 1.2s var(--ease); }
    .cosmos-bg::after { content:""; position:absolute; inset:0; background:linear-gradient(90deg,rgba(3,1,8,.74) 0%,rgba(3,1,8,.22) 38%,transparent 70%),linear-gradient(180deg,rgba(4,2,9,.08),transparent 48%,rgba(4,2,9,.44)); }
    #sky { position:absolute; inset:0; z-index:2; width:100%; height:100%; opacity:.52; pointer-events:none; }
    .orbits { position:absolute; z-index:3; inset:0; width:100%; height:100%; overflow:visible; pointer-events:none; }
    .orbit-path { fill:none; stroke:url(#orbitGradient); stroke-width:.7; opacity:.32; stroke-dasharray:2 7; animation:orbitFlow 14s linear infinite; }
    .memory-layer { position:absolute; z-index:4; inset:0; pointer-events:none; }
    .memory-node { --size:42px; position:absolute; width:var(--size); height:var(--size); margin:calc(var(--size) / -2); border:0; border-radius:50%; color:#fff; background:transparent; cursor:pointer; pointer-events:auto; filter:drop-shadow(0 0 16px rgba(151,112,255,.38)); transition:transform .45s var(--ease),filter .45s; animation:nodeFloat 5s ease-in-out infinite alternate; animation-delay:var(--delay); }
    .memory-node::before { content:""; position:absolute; inset:10%; border:1px solid rgba(222,207,255,.46); border-radius:50%; box-shadow:inset 0 0 18px rgba(177,142,255,.18),0 0 16px rgba(142,96,241,.18); animation:nodeOrbit 8s linear infinite; }
    .memory-node::after { content:""; position:absolute; inset:37%; border-radius:50%; background:radial-gradient(circle at 35% 30%,#fff 0 11%,#eadfff 24%,#a87cf8 52%,rgba(102,52,198,.3) 75%,transparent 100%); box-shadow:0 0 9px #fff,0 0 24px #ad83ff,0 0 54px rgba(121,73,222,.75); }
    .memory-node.locked::before { border-style:dashed; border-color:rgba(159,128,218,.38); }
    .memory-node.locked::after { background:radial-gradient(circle at 35% 30%,#d9c8ff,#7854bd 42%,rgba(75,40,131,.2) 76%,transparent); box-shadow:0 0 18px rgba(126,84,208,.64); }
    .memory-node span { position:absolute; top:calc(100% + 8px); left:50%; width:max-content; max-width:160px; padding:5px 8px; border:1px solid rgba(216,200,255,.15); border-radius:999px; color:rgba(248,244,255,.9); background:rgba(9,5,18,.74); backdrop-filter:blur(12px); font-size:10px; letter-spacing:.06em; opacity:0; transform:translate(-50%,-5px); transition:.3s; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; pointer-events:none; }
    .memory-node:hover,.memory-node:focus-visible { z-index:2; outline:none; transform:scale(1.3); filter:drop-shadow(0 0 30px rgba(186,154,255,.7)); }
    .memory-node:hover span,.memory-node:focus-visible span { opacity:1; transform:translate(-50%,0); }
    @keyframes orbitFlow { to { stroke-dashoffset:-72; } }
    @keyframes nodeFloat { to { translate:0 -7px; } }
    @keyframes nodeOrbit { to { transform:rotate(360deg); } }
    .veil { position:absolute; z-index:1; inset:0; pointer-events:none; background:radial-gradient(circle at 58% 44%,transparent 8%,rgba(5,2,11,.08) 46%,rgba(5,2,11,.64) 115%); }
    .noise { position:absolute; z-index:2; inset:0; opacity:.1; pointer-events:none; mix-blend-mode:soft-light; background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.48'/%3E%3C/svg%3E"); }

    .topbar { position:fixed; z-index:10; top:0; left:0; right:0; display:flex; align-items:center; justify-content:space-between; padding:max(22px,env(safe-area-inset-top)) max(24px,env(safe-area-inset-right)) 0 max(24px,env(safe-area-inset-left)); }
    .back { display:inline-flex; align-items:center; gap:10px; color:rgba(255,255,255,.72); text-decoration:none; font-size:12px; letter-spacing:.13em; transition:color .25s; }
    .back::before { content:"←"; font-size:18px; }
    .back:hover { color:#fff; }
    .local-badge { display:flex; align-items:center; gap:8px; color:rgba(255,255,255,.44); font:600 10px/1 ui-monospace,SFMono-Regular,monospace; letter-spacing:.12em; text-transform:uppercase; }
    .local-badge::before { content:""; width:6px; height:6px; border-radius:50%; background:#8ef2cf; box-shadow:0 0 12px #8ef2cf; }

    .stats { position:fixed; z-index:8; top:88px; right:30px; display:grid; gap:10px; width:170px; padding:17px 18px; border:1px solid var(--line); border-radius:18px; background:rgba(8,4,18,.38); backdrop-filter:blur(18px); }
    .stats-row { display:flex; align-items:baseline; justify-content:space-between; }
    .stats-label { color:var(--muted); font-size:11px; letter-spacing:.1em; }
    .stats-value { font:500 18px/1 ui-monospace,SFMono-Regular,monospace; }
    .meter { height:2px; overflow:hidden; background:rgba(255,255,255,.1); }
    .meter span { display:block; width:0; height:100%; background:linear-gradient(90deg,#7754e9,#d4c5ff); box-shadow:0 0 12px #a88cff; transition:width .8s var(--ease); }
    .level { color:var(--violet); font:600 10px/1.4 ui-monospace,SFMono-Regular,monospace; letter-spacing:.12em; }

    .empty { position:fixed; z-index:5; top:47%; left:50%; width:min(420px,78vw); text-align:center; transform:translate(-50%,-50%); pointer-events:none; transition:opacity .5s; }
    .empty.is-hidden { opacity:0; }
    .empty-mark { width:64px; height:64px; margin:0 auto 22px; border:1px solid rgba(194,173,255,.38); border-radius:50%; box-shadow:0 0 42px rgba(139,91,255,.18),inset 0 0 22px rgba(139,91,255,.11); animation:breathe 3.6s ease-in-out infinite; }
    .empty h2 { margin:0 0 11px; font-size:clamp(22px,3vw,34px); font-weight:500; letter-spacing:.08em; }
    .empty p { margin:0; color:var(--muted); font-size:13px; line-height:1.8; }
    @keyframes breathe { 50% { transform:scale(1.1); box-shadow:0 0 64px rgba(139,91,255,.36),inset 0 0 28px rgba(139,91,255,.18); } }

    .intro { position:fixed; z-index:8; left:max(28px,env(safe-area-inset-left)); bottom:max(30px,env(safe-area-inset-bottom)); width:min(520px,calc(100vw - 56px)); }
    .eyebrow { margin-bottom:12px; color:var(--violet); font:700 10px/1 ui-monospace,SFMono-Regular,monospace; letter-spacing:.21em; }
    h1 { margin:0 0 12px; font-size:clamp(34px,5vw,72px); font-weight:480; letter-spacing:-.05em; text-shadow:0 12px 36px rgba(0,0,0,.45); }
    .intro p { max-width:460px; margin:0 0 22px; color:var(--muted); font-size:13px; line-height:1.75; }
    .actions { display:flex; flex-wrap:wrap; gap:10px; }
    .btn { min-height:44px; padding:0 18px; border:1px solid var(--line); border-radius:999px; color:#fff; background:rgba(255,255,255,.045); cursor:pointer; letter-spacing:.06em; transition:transform .25s,border-color .25s,background .25s; }
    .btn:hover { transform:translateY(-2px); border-color:rgba(204,184,255,.48); background:rgba(178,148,255,.1); }
    .btn.primary { color:#130b24; border-color:#cbbaff; background:linear-gradient(135deg,#eee8ff,#a789fa); box-shadow:0 12px 30px rgba(115,75,211,.24); }

    .drawer { position:fixed; z-index:30; top:14px; right:14px; bottom:14px; width:min(430px,calc(100vw - 28px)); overflow:auto; padding:24px; border:1px solid var(--line); border-radius:24px; background:var(--panel); box-shadow:0 30px 90px rgba(0,0,0,.48); backdrop-filter:blur(30px) saturate(1.2); transform:translateX(calc(100% + 30px)); transition:transform .45s var(--ease); }
    .drawer.is-open { transform:translateX(0); }
    .drawer-head { display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:26px; }
    .drawer-kicker { margin-bottom:7px; color:var(--violet); font:700 10px/1 ui-monospace,SFMono-Regular,monospace; letter-spacing:.18em; }
    .drawer h2 { margin:0; font-size:25px; font-weight:520; }
    .icon-btn { display:grid; place-items:center; width:38px; height:38px; border:1px solid var(--line); border-radius:50%; color:#fff; background:transparent; cursor:pointer; font-size:20px; }
    .tabs { display:flex; gap:8px; margin-bottom:24px; padding:4px; border-radius:14px; background:rgba(255,255,255,.045); }
    .tab { flex:1; height:38px; border:0; border-radius:10px; color:var(--muted); background:transparent; cursor:pointer; font-size:12px; }
    .tab.is-active { color:#fff; background:rgba(183,155,255,.15); }
    .pane[hidden] { display:none; }
    .field { display:grid; gap:8px; margin-bottom:16px; }
    .field label, .field-title { color:rgba(244,239,255,.7); font-size:11px; letter-spacing:.08em; }
    input, textarea { width:100%; border:1px solid var(--line); border-radius:13px; outline:0; color:#fff; background:rgba(4,2,10,.38); transition:border-color .25s,box-shadow .25s; }
    input { height:46px; padding:0 13px; }
    textarea { min-height:132px; resize:vertical; padding:13px; line-height:1.65; }
    input:focus, textarea:focus { border-color:rgba(187,158,255,.64); box-shadow:0 0 0 3px rgba(157,115,255,.1); }
    input::placeholder, textarea::placeholder { color:rgba(255,255,255,.25); }
    .moods { display:flex; flex-wrap:wrap; gap:8px; }
    .mood { padding:8px 11px; border:1px solid var(--line); border-radius:999px; color:var(--muted); background:transparent; cursor:pointer; font-size:11px; }
    .mood.is-active { color:#fff; border-color:#aa8df4; background:rgba(148,104,244,.18); }
    .attachment { display:flex; align-items:center; justify-content:space-between; min-height:46px; padding:0 13px; border:1px dashed rgba(205,190,255,.25); border-radius:13px; color:var(--muted); cursor:pointer; font-size:12px; }
    .attachment input { display:none; }
    .file-name { max-width:230px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:rgba(255,255,255,.82); }
    .privacy { margin:14px 0 18px; color:rgba(255,255,255,.35); font-size:10px; line-height:1.65; }
    .submit { width:100%; height:48px; border:0; border-radius:14px; color:#160d28; background:linear-gradient(135deg,#f1edff,#aa91f3); cursor:pointer; font-weight:700; letter-spacing:.08em; }

    .archive { display:grid; gap:10px; }
    .archive-empty { padding:38px 12px; color:var(--muted); text-align:center; font-size:12px; line-height:1.8; }
    .echo-item { width:100%; padding:15px; border:1px solid var(--line); border-radius:15px; color:#fff; text-align:left; background:rgba(255,255,255,.035); cursor:pointer; transition:border-color .25s,transform .25s; }
    .echo-item:hover { transform:translateY(-2px); border-color:rgba(193,169,255,.46); }
    .echo-top { display:flex; align-items:center; justify-content:space-between; gap:12px; }
    .echo-title { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:14px; }
    .echo-state { flex:none; color:#9f82eb; font:700 9px/1 ui-monospace,SFMono-Regular,monospace; letter-spacing:.1em; }
    .echo-state.open { color:#90e6c8; }
    .echo-date { margin-top:8px; color:rgba(255,255,255,.36); font-size:10px; }

    .viewer { position:fixed; z-index:50; inset:0; display:grid; place-items:center; padding:20px; background:rgba(3,1,8,.7); backdrop-filter:blur(18px); opacity:0; visibility:hidden; transition:opacity .3s,visibility .3s; }
    .viewer.is-open { opacity:1; visibility:visible; }
    .memory { position:relative; width:min(600px,100%); max-height:min(760px,90vh); overflow:auto; padding:30px; border:1px solid rgba(210,194,255,.22); border-radius:24px; background:linear-gradient(145deg,rgba(29,17,51,.96),rgba(9,5,18,.96)); box-shadow:0 40px 110px rgba(0,0,0,.6); }
    .memory .icon-btn { position:absolute; top:18px; right:18px; }
    .memory-mood { color:var(--violet); font:700 10px/1 ui-monospace,SFMono-Regular,monospace; letter-spacing:.15em; }
    .memory h2 { margin:14px 50px 8px 0; font-size:30px; font-weight:500; }
    .memory-date { color:rgba(255,255,255,.38); font-size:11px; }
    .memory-text { margin-top:25px; color:rgba(255,255,255,.82); font-size:15px; line-height:1.9; white-space:pre-wrap; }
    .memory-media { margin-top:22px; }
    .memory-media img { display:block; width:100%; max-height:380px; object-fit:contain; border-radius:14px; background:#050308; }
    .memory-media audio { width:100%; }
    .locked { padding:38px 10px 12px; text-align:center; }
    .lock-orb { width:74px; height:74px; margin:0 auto 22px; border:1px solid rgba(191,163,255,.36); border-radius:50%; box-shadow:0 0 50px rgba(127,77,235,.22),inset 0 0 24px rgba(127,77,235,.14); }
    .locked strong { display:block; margin-bottom:9px; font-size:20px; }
    .locked span { color:var(--muted); font-size:12px; }
    .toast { position:fixed; z-index:80; left:50%; bottom:24px; padding:12px 17px; border:1px solid var(--line); border-radius:999px; color:#fff; background:rgba(15,9,27,.9); backdrop-filter:blur(16px); opacity:0; transform:translate(-50%,16px); transition:.3s; pointer-events:none; font-size:12px; }
    .toast.is-show { opacity:1; transform:translate(-50%,0); }

    @media (max-width:760px) {
      .cosmos-bg { background-position:50% 50%; }
      .cosmos-bg::after { background:linear-gradient(180deg,rgba(3,1,8,.18),rgba(3,1,8,.05) 48%,rgba(3,1,8,.74) 82%); }
      .topbar { padding-top:max(18px,env(safe-area-inset-top)); }
      .local-badge { display:none; }
      .stats { top:66px; right:18px; width:148px; padding:14px; }
      .stats-row:nth-child(2) { display:none; }
      .intro { left:20px; bottom:max(20px,env(safe-area-inset-bottom)); width:calc(100vw - 40px); }
      h1 { font-size:42px; }
      .intro p { max-width:330px; font-size:12px; }
      .drawer { top:auto; left:8px; right:8px; bottom:8px; width:auto; max-height:88vh; transform:translateY(calc(100% + 20px)); }
      .drawer.is-open { transform:translateY(0); }
      .memory { padding:24px 20px; }
    }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation-duration:.01ms !important; transition-duration:.01ms !important; } }
  </style>
</head>
<body>
  <main class="app">
    <div class="cosmos-bg" aria-hidden="true"></div>
    <canvas id="sky" aria-label="由你的回声组成的星域"></canvas>
    <svg class="orbits" id="orbits" aria-hidden="true"><defs><linearGradient id="orbitGradient" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8b68e8" stop-opacity="0"/><stop offset=".48" stop-color="#d9c8ff" stop-opacity=".72"/><stop offset="1" stop-color="#7c5bd5" stop-opacity=".08"/></linearGradient></defs><g id="orbitPaths"></g></svg>
    <div class="memory-layer" id="memoryLayer" aria-label="回声星体"></div>
    <div class="veil"></div><div class="noise"></div>
    <header class="topbar"><a class="back" href="index.html#explore">返回主页</a><div class="local-badge">仅保存在此设备</div></header>

    <aside class="stats" aria-label="星域状态">
      <div class="stats-row"><span class="stats-label">回声</span><span class="stats-value" id="echoCount">0</span></div>
      <div class="stats-row"><span class="stats-label">已抵达</span><span class="stats-value" id="openCount">0</span></div>
      <div class="meter"><span id="meter"></span></div>
      <div class="level" id="level">等待第一束光</div>
    </aside>

    <section class="empty" id="empty"><div class="empty-mark"></div><h2>这里还没有回声</h2><p>写下第一段话，它会成为紫域里的第一颗星。</p></section>

    <section class="intro">
      <div class="eyebrow">05 / VIOLET ECHO</div>
      <h1>紫域回声</h1>
      <p>把文字、照片或声音交给未来。每一份记忆都会化成一颗星；写得越多，这片星域就越接近完整。</p>
      <div class="actions"><button class="btn primary" id="writeBtn">写一段回声</button><button class="btn" id="archiveBtn">回声档案</button></div>
    </section>

    <aside class="drawer" id="drawer" aria-hidden="true">
      <div class="drawer-head"><div><div class="drawer-kicker">TIME CAPSULE</div><h2>交给未来</h2></div><button class="icon-btn" id="closeDrawer" aria-label="关闭">×</button></div>
      <div class="tabs"><button class="tab is-active" data-pane="compose">写回声</button><button class="tab" data-pane="archive">星图档案</button></div>
      <section class="pane" id="composePane">
        <form id="echoForm">
          <div class="field"><label for="title">它叫什么</label><input id="title" maxlength="36" placeholder="例如：写给一年后的我"></div>
          <div class="field"><label for="message">想留下的话</label><textarea id="message" maxlength="1200" required placeholder="此刻的你，正在想什么？"></textarea></div>
          <div class="field"><span class="field-title">此刻的情绪</span><div class="moods" id="moods"><button type="button" class="mood is-active">平静</button><button type="button" class="mood">期待</button><button type="button" class="mood">勇敢</button><button type="button" class="mood">想念</button><button type="button" class="mood">未知</button></div></div>
          <div class="field"><label for="unlockDate">让它何时抵达</label><input id="unlockDate" type="date"></div>
          <div class="field"><span class="field-title">附上一段画面或声音</span><label class="attachment" for="attachment"><span>选择照片 / 音频</span><span class="file-name" id="fileName">可选</span><input id="attachment" type="file" accept="image/*,audio/*"></label></div>
          <p class="privacy">内容保存在当前浏览器中，不会上传到服务器。清除浏览器数据可能同时清除这些回声。</p>
          <button class="submit" type="submit">封存为一颗星</button>
        </form>
      </section>
      <section class="pane" id="archivePane" hidden><div class="archive" id="archive"></div></section>
    </aside>

    <div class="viewer" id="viewer" aria-hidden="true"><article class="memory" id="memory"><button class="icon-btn" id="closeViewer" aria-label="关闭">×</button><div id="memoryBody"></div></article></div>
    <div class="toast" id="toast"></div>
  </main>

  <script>
    const STORAGE_KEY = "violet-echo-memories-v1";
    const CAPACITY = 24;
    const canvas = document.querySelector("#sky");
    const ctx = canvas.getContext("2d");
    const drawer = document.querySelector("#drawer");
    const viewer = document.querySelector("#viewer");
    const form = document.querySelector("#echoForm");
    const archiveRoot = document.querySelector("#archive");
    const fileInput = document.querySelector("#attachment");
    let memories = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
    let mood = "平静";
    let baseStars = [];
    let memoryPoints = [];
    let width = 0, height = 0, dpr = 1, frame = 0;

    const dbPromise = new Promise((resolve, reject) => {
      const request = indexedDB.open("violet-echo-assets", 1);
      request.onupgradeneeded = () => request.result.createObjectStore("attachments");
      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(request.error);
    });
    async function saveAttachment(id, file) { const db = await dbPromise; const tx = db.transaction("attachments", "readwrite"); tx.objectStore("attachments").put(file, id); return new Promise((resolve,reject) => { tx.oncomplete=resolve; tx.onerror=()=>reject(tx.error); }); }
    async function getAttachment(id) { const db = await dbPromise; const tx = db.transaction("attachments", "readonly"); const request = tx.objectStore("attachments").get(id); return new Promise((resolve,reject) => { request.onsuccess=()=>resolve(request.result); request.onerror=()=>reject(request.error); }); }

    function resize() {
      dpr = Math.min(devicePixelRatio || 1, 2); width = innerWidth; height = innerHeight;
      canvas.width = width * dpr; canvas.height = height * dpr; canvas.style.width = `${width}px`; canvas.style.height = `${height}px`; ctx.setTransform(dpr,0,0,dpr,0,0);
      const count = Math.round((width * height) / 10000);
      baseStars = Array.from({length:count}, (_,i) => ({ x:(Math.sin(i*91.73)*.5+.5)*width, y:(Math.sin(i*47.11+2)*.5+.5)*height, r:.25+(i%7)/8, phase:i*.71, depth:.35+(i%11)/14 }));
      renderMemoryField();
    }
    function hash(text) { let value=2166136261; for (const char of text) value=(value^char.charCodeAt(0))*16777619; return Math.abs(value); }
    function layoutMemories() {
      const radius = Math.min(width,height) * .29, cx=width*.5, cy=height*.5;
      memoryPoints = memories.map((memory,index) => {
        const seed=hash(memory.id), arm=index%3, row=Math.floor(index/3), angle=arm*Math.PI*2/3+row*.62+(seed%80)/500, distance=70+Math.sqrt((index+1)/CAPACITY)*radius;
        return { memory, arm, x:cx+Math.cos(angle)*distance*1.28, y:cy+Math.sin(angle)*distance*.62, size:36+Math.min(memory.text.length/120,10), phase:(seed%628)/100 };
      });
    }
    function renderMemoryField() {
      const layer=document.querySelector("#memoryLayer"), paths=document.querySelector("#orbitPaths"), svg=document.querySelector("#orbits");
      if(!layer||!paths) return; layer.replaceChildren(); paths.replaceChildren(); svg.setAttribute("viewBox",`0 0 ${width} ${height}`); layoutMemories();
      const cx=width*.5, cy=height*.5;
      memoryPoints.forEach((point,index) => {
        const path=document.createElementNS("http://www.w3.org/2000/svg","path"), bend=(index%2?1:-1)*(36+index%4*9);
        path.setAttribute("class","orbit-path"); path.setAttribute("d",`M ${cx} ${cy} C ${cx+bend} ${cy-(point.y-cy)*.28}, ${point.x-bend*.45} ${point.y+(point.x-cx)*.08}, ${point.x} ${point.y}`); path.style.animationDelay=`${-index*1.3}s`; paths.append(path);
        const node=document.createElement("button"), label=document.createElement("span"); node.type="button"; node.className=`memory-node${isUnlocked(point.memory)?"":" locked"}`; node.style.left=`${point.x}px`; node.style.top=`${point.y}px`; node.style.setProperty("--size",`${point.size}px`); node.style.setProperty("--delay",`${-(point.phase%4)}s`); node.setAttribute("aria-label",`${isUnlocked(point.memory)?"打开":"尚未解锁"}：${point.memory.title||"未命名的回声"}`); label.textContent=point.memory.title||"未命名的回声"; node.append(label); node.addEventListener("click",()=>openMemory(point.memory)); layer.append(node);
      });
    }
    function draw() {
      frame += .008; ctx.clearRect(0,0,width,height); ctx.globalCompositeOperation="lighter";
      for (const star of baseStars) { const drift=Math.sin(frame*.5+star.phase)*star.depth*2, alpha=(.12+(Math.sin(frame*(.7+star.depth)+star.phase)+1)*.14)*star.depth; ctx.fillStyle=`rgba(229,222,255,${alpha})`; ctx.beginPath(); ctx.arc(star.x+drift,star.y,star.r*star.depth,0,Math.PI*2); ctx.fill(); }
      ctx.globalCompositeOperation="source-over";
      requestAnimationFrame(draw);
    }
    function isUnlocked(memory) { return !memory.unlockAt || Date.now() >= memory.unlockAt; }
    function levelFor(count) { if(!count) return "等待第一束光"; if(count<6) return "I · 微光初生"; if(count<12) return "II · 星云成形"; if(count<24) return "III · 轨道苏醒"; return "IV · 紫域完整"; }
    function refresh() {
      const unlocked=memories.filter(isUnlocked).length, completion=Math.min(memories.length/CAPACITY*100,100);
      document.querySelector("#echoCount").textContent=memories.length; document.querySelector("#openCount").textContent=unlocked; document.querySelector("#meter").style.width=`${completion}%`; document.querySelector("#level").textContent=levelFor(memories.length); document.querySelector("#empty").classList.toggle("is-hidden",memories.length>0); document.querySelector(".app").style.setProperty("--progress",completion/100); renderArchive(); renderMemoryField();
    }
    function setPane(name) { document.querySelectorAll(".tab").forEach(tab=>tab.classList.toggle("is-active",tab.dataset.pane===name)); document.querySelector("#composePane").hidden=name!=="compose"; document.querySelector("#archivePane").hidden=name!=="archive"; }
    function openDrawer(pane="compose") { setPane(pane); drawer.classList.add("is-open"); drawer.setAttribute("aria-hidden","false"); }
    function closeDrawer() { drawer.classList.remove("is-open"); drawer.setAttribute("aria-hidden","true"); }
    function renderArchive() {
      archiveRoot.replaceChildren();
      if(!memories.length) { const empty=document.createElement("div"); empty.className="archive-empty"; empty.textContent="你的星图还没有留下坐标。\n先写一段回声吧。"; archiveRoot.append(empty); return; }
      [...memories].reverse().forEach(memory => {
        const button=document.createElement("button"), top=document.createElement("div"), title=document.createElement("span"), state=document.createElement("span"), date=document.createElement("div");
        button.className="echo-item"; top.className="echo-top"; title.className="echo-title"; state.className=`echo-state${isUnlocked(memory)?" open":""}`; date.className="echo-date";
        title.textContent=memory.title||"未命名的回声"; state.textContent=isUnlocked(memory)?"已抵达":"封存中"; date.textContent=`写于 ${formatDate(memory.createdAt)} · ${memory.mood}`;
        top.append(title,state); button.append(top,date); button.addEventListener("click",()=>openMemory(memory)); archiveRoot.append(button);
      });
    }
    function formatDate(time) { return new Intl.DateTimeFormat("zh-CN",{year:"numeric",month:"long",day:"numeric"}).format(new Date(time)); }
    async function openMemory(memory) {
      const body=document.querySelector("#memoryBody"); body.replaceChildren();
      if(!isUnlocked(memory)) {
        const locked=document.createElement("div"); locked.className="locked"; const days=Math.max(1,Math.ceil((memory.unlockAt-Date.now())/86400000)); locked.innerHTML=`<div class="lock-orb"></div><strong>这颗星尚未抵达</strong><span>还有 ${days} 天，它才会回应你。</span>`; body.append(locked);
      } else {
        const moodEl=document.createElement("div"), heading=document.createElement("h2"), date=document.createElement("div"), text=document.createElement("div"), media=document.createElement("div");
        moodEl.className="memory-mood"; date.className="memory-date"; text.className="memory-text"; media.className="memory-media";
        moodEl.textContent=`ECHO · ${memory.mood}`; heading.textContent=memory.title||"未命名的回声"; date.textContent=`写于 ${formatDate(memory.createdAt)}`; text.textContent=memory.text; body.append(moodEl,heading,date,text,media);
        if(memory.hasAttachment) try { const file=await getAttachment(memory.id); if(file) { const url=URL.createObjectURL(file); if(file.type.startsWith("image/")) { const img=document.createElement("img"); img.src=url; img.alt="回声中保存的照片"; media.append(img); } else if(file.type.startsWith("audio/")) { const audio=document.createElement("audio"); audio.src=url; audio.controls=true; media.append(audio); } } } catch(_) {}
      }
      viewer.classList.add("is-open"); viewer.setAttribute("aria-hidden","false");
    }
    function closeViewer() { viewer.classList.remove("is-open"); viewer.setAttribute("aria-hidden","true"); }
    let toastTimer; function showToast(text) { const toast=document.querySelector("#toast"); toast.textContent=text; toast.classList.add("is-show"); clearTimeout(toastTimer); toastTimer=setTimeout(()=>toast.classList.remove("is-show"),2400); }

    document.querySelector("#writeBtn").addEventListener("click",()=>openDrawer("compose")); document.querySelector("#archiveBtn").addEventListener("click",()=>openDrawer("archive")); document.querySelector("#closeDrawer").addEventListener("click",closeDrawer); document.querySelector("#closeViewer").addEventListener("click",closeViewer); viewer.addEventListener("click",event=>{ if(event.target===viewer) closeViewer(); });
    document.querySelectorAll(".tab").forEach(tab=>tab.addEventListener("click",()=>setPane(tab.dataset.pane))); document.querySelectorAll(".mood").forEach(button=>button.addEventListener("click",()=>{ mood=button.textContent; document.querySelectorAll(".mood").forEach(item=>item.classList.toggle("is-active",item===button)); }));
    fileInput.addEventListener("change",()=>{ const file=fileInput.files[0]; document.querySelector("#fileName").textContent=file?file.name:"可选"; });
    form.addEventListener("submit",async event => {
      event.preventDefault(); const text=document.querySelector("#message").value.trim(); if(!text) return;
      const file=fileInput.files[0]; if(file&&file.size>15*1024*1024) { showToast("附件请控制在 15MB 以内"); return; }
      const id=`echo-${Date.now()}-${Math.random().toString(36).slice(2,7)}`, rawDate=document.querySelector("#unlockDate").value;
      const memory={id,title:document.querySelector("#title").value.trim(),text,mood,createdAt:Date.now(),unlockAt:rawDate?new Date(`${rawDate}T00:00:00`).getTime():Date.now(),hasAttachment:Boolean(file)};
      if(file) try { await saveAttachment(id,file); } catch(_) { memory.hasAttachment=false; }
      memories.push(memory); localStorage.setItem(STORAGE_KEY,JSON.stringify(memories)); form.reset(); mood="平静"; document.querySelectorAll(".mood").forEach((item,index)=>item.classList.toggle("is-active",index===0)); document.querySelector("#fileName").textContent="可选"; refresh(); closeDrawer(); showToast("一颗新的星已经进入紫域");
    });
    addEventListener("resize",resize); addEventListener("keydown",event=>{ if(event.key==="Escape"){closeDrawer();closeViewer();} });
    resize(); refresh(); draw();
  </script>
</body>
</html>
