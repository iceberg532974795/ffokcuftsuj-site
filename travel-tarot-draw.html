  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed=&quot;true&quot;],
    [aria-selected=&quot;true&quot;],
    .is-selected
  ) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: 16px !important;
  height: 16px !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

      position: relative;
      isolation: isolate;
      min-height: 100dvh;
      overflow: hidden;
      color: var(--tt-ink);
      background:
        radial-gradient(circle at 50% 36%, color-mix(in srgb, var(--tt-violet) 22%, transparent), transparent 33%),
        radial-gradient(circle at 14% 72%, color-mix(in srgb, var(--tt-cyan) 12%, transparent), transparent 32%),
        radial-gradient(circle at 88% 76%, color-mix(in srgb, var(--tt-gold) 11%, transparent), transparent 28%),

      font-family: ui-serif, &quot;Songti SC&quot;, &quot;Noto Serif SC&quot;, Georgia, serif;
    }
    #travel-tarot::before {
      content: &quot;&quot;;
      position: absolute;
      inset: 0;
      z-index: -1;
      opacity: .42;
      background-image:
        radial-gradient(circle, color-mix(in srgb, var(--tt-ink) 66%, transparent) 0 1px, transparent 1.5px),
        radial-gradient(circle, color-mix(in srgb, var(--tt-gold) 60%, transparent) 0 1px, transparent 1.5px);
      background-size: 67px 67px, 103px 103px;
      background-position: 8px 17px, 41px 51px;
      animation: tt-stars 18s linear infinite;
    }
    #travel-tarot * { box-sizing: border-box; }
    #travel-tarot .tt-shell { width: min(1280px, calc(100% - 40px)); min-height: 100dvh; margin: 0 auto; padding: clamp(34px, 6vh, 68px) 0 38px; text-align: center; }
    #travel-tarot .tt-kicker { margin: 0; color: var(--tt-cyan); letter-spacing: .28em; text-transform: uppercase; }
    #travel-tarot .tt-heading { margin: 12px 0 8px; font-size: clamp(36px, 6vw, 76px); font-weight: 500; letter-spacing: -.05em; }
    #travel-tarot .tt-intro { margin: 0 auto; max-width: 620px; color: var(--tt-muted); }
    #travel-tarot .tt-stage { position: relative; margin-top: 38px; min-height: 480px; }
    #travel-tarot .tt-stage::before {
      content: &quot;✦ 　☽　 ✧　 ☉　 ✧　 ☾　 ✦&quot;;
      position: absolute;
      top: 47%; left: 50%;
      transform: translate(-50%, -50%);
      width: min(100%, 980px);
      color: color-mix(in srgb, var(--tt-gold) 18%, transparent);
      font-size: clamp(42px, 8vw, 104px);
      letter-spacing: .12em;
      white-space: nowrap;
      filter: blur(.2px);
    }
    #travel-tarot .tt-cards { position: relative; display: grid; grid-template-columns: repeat(3, minmax(0, 250px)); justify-content: center; gap: clamp(18px, 4vw, 54px); perspective: 1500px; }
    #travel-tarot .tt-slot { position: relative; width: 100%; aspect-ratio: 5 / 8; }
    #travel-tarot .tt-card {
      position: absolute;
      inset: 0;
      width: 100%; height: 100%;
      padding: 0;
      border: 0;
      background: transparent;
      color: inherit;
      cursor: pointer;
      transform-style: preserve-3d;
      transition: transform 1.05s cubic-bezier(.2,.75,.15,1), filter .35s, opacity .55s;
    }
    #travel-tarot .tt-card:hover:not(:disabled) { transform: translateY(-13px) rotateX(3deg) scale(1.025); filter: brightness(1.18); }
    #travel-tarot .tt-card:focus-visible { outline: 2px solid var(--tt-cyan); outline-offset: 8px; }
    #travel-tarot .tt-card.is-chosen { transform: translateY(-10px) rotateY(180deg) scale(1.06); z-index: 12; }
    #travel-tarot .tt-card.is-gone { opacity: 0; pointer-events: none; }
    #travel-tarot .tt-face {
      position: absolute; inset: 0;
      overflow: hidden;
      border-radius: 18px;
      backface-visibility: hidden;
      border: 1px solid color-mix(in srgb, var(--tt-gold) 58%, transparent);
      box-shadow: 0 28px 70px rgba(0,0,0,.72), 0 0 38px color-mix(in srgb, var(--tt-violet) 24%, transparent), inset 0 0 28px color-mix(in srgb, var(--tt-gold) 14%, transparent);
    }
    #travel-tarot .tt-back {
      display: grid;
      place-items: center;
      background:
        linear-gradient(180deg, rgba(2,4,14,.04), rgba(2,3,12,.24)),
        var(--tt-card-art) center / cover no-repeat;
    }
    #travel-tarot .tt-back::before { content: &quot;&quot;; position: absolute; inset: 8px; border: 1px solid color-mix(in srgb, var(--tt-gold) 64%, transparent); border-radius: 12px; box-shadow: inset 0 0 24px rgba(3,5,18,.42); }
    #travel-tarot .tt-back::after { content: &quot;&quot;; position: absolute; inset: 0; background: radial-gradient(circle at 50% 49%, transparent 38%, rgba(1,2,10,.25) 100%); }
    #travel-tarot .tt-sigil { display: none; }
    #travel-tarot .tt-number { position: absolute; left: 0; right: 0; bottom: 18px; z-index: 3; font-size: 10px; letter-spacing: .27em; color: #f3d896; text-shadow: 0 2px 8px #02030a, 0 0 12px rgba(232,192,102,.46); }
    #travel-tarot .tt-front {
      transform: rotateY(180deg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 28px 20px;
      background:
        radial-gradient(ellipse at 50% 53%, rgba(2,4,15,.28) 0 30%, rgba(2,4,15,.08) 58%, rgba(1,2,9,.34) 100%),
        linear-gradient(180deg, rgba(4,5,18,.06), rgba(2,3,12,.18)),
        var(--tt-front-art) center / cover no-repeat;
    }
    #travel-tarot .tt-front::before { content: &quot;&quot;; position: absolute; inset: 9px; border: 1px solid color-mix(in srgb, var(--tt-gold) 62%, transparent); border-radius: 12px; box-shadow: inset 0 0 38px rgba(1,2,10,.68), 0 0 14px color-mix(in srgb, var(--tt-cyan) 15%, transparent); }
    #travel-tarot .tt-front::after { content: &quot;✦&quot;; position: absolute; top: 36px; color: var(--tt-gold); font-size: 34px; text-shadow: 0 0 22px currentColor; animation: tt-pulse 2.2s ease-in-out infinite; }
    #travel-tarot .tt-dest-label { position: relative; z-index: 2; margin-top: 32px; color: var(--tt-cyan); letter-spacing: .24em; }
    #travel-tarot .tt-city { position: relative; z-index: 2; margin: 15px 0 6px; font-size: clamp(34px, 5vw, 58px); font-weight: 500; letter-spacing: .08em; text-shadow: 0 0 28px color-mix(in srgb, var(--tt-violet) 72%, transparent); }
    #travel-tarot .tt-province { position: relative; z-index: 2; color: var(--tt-muted); letter-spacing: .18em; }
    #travel-tarot .tt-omen { position: relative; z-index: 2; margin-top: 30px; max-width: 180px; color: color-mix(in srgb, var(--tt-gold) 76%, var(--tt-ink)); }
    #travel-tarot .tt-shards { position: absolute; inset: -18%; z-index: 20; pointer-events: none; overflow: visible; }
    #travel-tarot .tt-nebula-ghost { position: absolute; inset: 15.25%; border-radius: 18px; background: var(--tt-card-art) center / cover no-repeat; opacity: 0; filter: brightness(1.35) saturate(1.25); box-shadow: 0 0 28px color-mix(in srgb, var(--tt-cyan) 48%, transparent); }
    #travel-tarot .tt-shards.is-breaking .tt-nebula-ghost { animation: tt-nebula-ghost 1.25s ease-out forwards; }
    #travel-tarot .tt-nebula-cloud { position: absolute; left: var(--x); top: var(--y); width: var(--size); aspect-ratio: 1.45; border-radius: 50%; opacity: 0; background: radial-gradient(ellipse at 42% 46%, color-mix(in srgb, var(--cloud-core) 52%, transparent) 0 7%, color-mix(in srgb, var(--cloud-edge) 34%, transparent) 28%, transparent 68%); filter: blur(var(--blur)) saturate(1.25); mix-blend-mode: screen; transform-origin: center; }
    #travel-tarot .tt-shards.is-breaking .tt-nebula-cloud { animation: tt-nebula-cloud 1.95s cubic-bezier(.14,.62,.2,1) forwards; animation-delay: var(--delay); }
    #travel-tarot .tt-dust { position: absolute; left: 50%; top: 50%; width: var(--size); height: var(--size); border-radius: 50%; background: var(--dust-color); box-shadow: 0 0 7px var(--dust-color), 0 0 16px var(--dust-color); opacity: 0; }
    #travel-tarot .tt-shards.is-breaking .tt-dust { animation: tt-nebula-dust 1.85s cubic-bezier(.13,.63,.24,1) forwards; animation-delay: var(--delay); }
    #travel-tarot .tt-controls { min-height: 74px; display: grid; justify-items: center; align-content: start; }
    #travel-tarot .tt-message { margin: 0; color: var(--tt-muted); letter-spacing: .06em; }
    #travel-tarot .tt-reset { margin-top: 14px; }
    #travel-tarot .tt-reset[hidden] { display: none; }
    @keyframes tt-stars { to { background-position: 75px 84px, -62px 154px; } }
    @keyframes tt-orbit { to { transform: rotate(360deg); } }
    @keyframes tt-counter { to { transform: rotate(-360deg); } }
    @keyframes tt-pulse { 50% { transform: scale(1.25); opacity: .7; } }
    @keyframes tt-nebula-ghost {
      0% { opacity: 1; transform: scale(1); filter: brightness(1.3) saturate(1.2) blur(0); }
      22% { opacity: .88; transform: scale(1.02); filter: brightness(1.7) saturate(1.45) blur(1px); }
      100% { opacity: 0; transform: scale(1.16); filter: brightness(.65) saturate(1.5) blur(13px); }
    }
    @keyframes tt-nebula-cloud {
      0% { opacity: 0; transform: translate3d(0,0,0) rotate(0) scale(.32); }
      20% { opacity: .5; }
      68% { opacity: .3; }
      100% { opacity: 0; transform: translate3d(var(--dx),var(--dy),0) rotate(var(--rot)) scale(1.7); filter: blur(calc(var(--blur) + 7px)) saturate(1.08); }
    }
    @keyframes tt-nebula-dust {
      0% { opacity: 0; transform: translate3d(0,0,0) scale(.2); }
      20% { opacity: 1; }
      70% { opacity: .72; }
      100% { opacity: 0; transform: translate3d(var(--dx),var(--dy),0) scale(.05); }
    }
    @media (max-width: 760px) {
      #travel-tarot { min-height: 100dvh; }
      #travel-tarot .tt-shell { width: 100%; min-height: 100dvh; padding: 28px 10px 24px; }
      #travel-tarot .tt-kicker { font-size: 10px; letter-spacing: .2em; }
      #travel-tarot .tt-heading { margin-top: 9px; font-size: clamp(29px, 9.2vw, 40px); }
      #travel-tarot .tt-intro { max-width: 92%; font-size: 12px; }
      #travel-tarot .tt-cards { grid-template-columns: repeat(3, minmax(0, calc((100vw - 36px) / 3))); gap: 8px; }
      #travel-tarot .tt-stage { min-height: 500px; margin-top: 28px; }
      #travel-tarot .tt-face { border-radius: 12px; }
      #travel-tarot .tt-number { bottom: 13px; font-size: 8px; letter-spacing: .14em; }
      #travel-tarot .tt-front { justify-content: center; padding: 36px 5px 22px; }
      #travel-tarot .tt-front::after { top: 19px; font-size: 22px; }
      #travel-tarot .tt-dest-label { margin-top: 7px; max-width: 100%; font-size: 7px; letter-spacing: .08em; white-space: nowrap; }
      #travel-tarot .tt-city { margin: 9px 0 5px; font-size: clamp(21px, 6.4vw, 30px); letter-spacing: .03em; line-height: 1.05; white-space: nowrap; }
      #travel-tarot .tt-province { max-width: 100%; font-size: 8px; letter-spacing: .04em; line-height: 1.2; white-space: nowrap; }
      #travel-tarot .tt-omen { margin-top: 13px; max-width: 94%; font-size: 9px; line-height: 1.45; }
      #travel-tarot .tt-card.is-chosen { transform: translateY(-5px) rotateY(180deg) scale(1.08); }
      #travel-tarot .tt-controls { min-height: 62px; padding: 0 12px; }
    }
    @media (prefers-reduced-motion: reduce) {
      #travel-tarot *, #travel-tarot *::before, #travel-tarot *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; }
    }
